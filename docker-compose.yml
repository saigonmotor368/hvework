version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hve_postgres
    environment:
      POSTGRES_USER: hve_user
      POSTGRES_PASSWORD: hve_password
      POSTGRES_DB: hve_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hve_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
